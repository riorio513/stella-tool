<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>筆灯 - 小説家の交流サイト</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* レトロな書庫・文豪の趣を漂わせるアースカラー（単一テーマ） */
        :root {
            --bg-color: #ece1c9;        /* 白よりのベージュ（やや古紙の色） */
            --card-bg-color: #f6efdc;   /* 生成りの紙色 */
            --border-color: #cdbb98;    /* くすんだ亜麻色 */
            --text-color: #4a3526;      /* 濃い茶（インク） */
            --text-muted-color: #8a7458;/* セピア */
            --accent-color: #8a5a36;    /* テラコッタ／革表紙の茶 */
            --accent-hover-color: #6f4527;
            --accent-soft-color: rgba(138,90,54,0.12);
            --danger-color: #a8472f;    /* 朱／弁柄色 */
            --danger-hover-color: #8a3824;
            --header-bg-color: #e3d6b8; /* 書棚の木肌 */
        }
        body { font-family: 'Inter','Noto Sans JP',sans-serif; background-color: var(--bg-color); color: var(--text-color); }
        .serif { font-family: 'Noto Serif JP', serif; }
        .card { background-color: var(--card-bg-color); border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0,0,0,.08), 0 2px 4px -2px rgba(0,0,0,.08); transition: background-color .3s, border-color .3s; }
        .btn-accent { background-color: var(--accent-color); color:#fff; transition: background-color .2s, transform .1s; box-shadow: 0 2px 4px rgba(0,0,0,.15); }
        .btn-accent:hover { background-color: var(--accent-hover-color); }
        .btn-accent:active { transform: translateY(1px); }
        .btn-ghost { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-color); transition: background-color .2s, border-color .2s; }
        .btn-ghost:hover { background-color: var(--accent-soft-color); border-color: var(--accent-color); }
        .btn-danger { background-color: var(--danger-color); color:#fff; transition: background-color .2s; }
        .btn-danger:hover { background-color: var(--danger-hover-color); }
        .input-field, .textarea-field { background-color: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); transition: border-color .2s; }
        .input-field:focus, .textarea-field:focus { outline: none; border-color: var(--accent-color); box-shadow: 0 0 0 2px var(--accent-soft-color); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        .nav-btn { color: var(--text-muted-color); transition: color .2s; }
        .nav-btn.active { color: var(--accent-color); }
        .nav-btn.active .nav-icon { transform: translateY(-2px); }
        .nav-icon { transition: transform .2s; }
        @keyframes fadeIn { from {opacity:0; transform: translateY(8px);} to {opacity:1; transform: translateY(0);} }
        .fade-in { animation: fadeIn .35s ease-out forwards; }
        .badge { font-size:.65rem; padding:.1rem .45rem; border-radius:9999px; font-weight:600; }
        .badge-admin { background:#b58a2e; color:#fff; }
        .badge-author { background: var(--accent-color); color:#fff; }
        /* Tailwindの原色をアースカラーへ寄せる */
        .text-rose-400 { color: var(--danger-color) !important; }
        .text-amber-400 { color: #b58a2e !important; }
        .text-emerald-400 { color: #5c7a3f !important; }
        .avatar { display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; flex-shrink:0; }
        .blog-body { white-space: pre-wrap; line-height: 1.9; }
        .chip { border:1px solid var(--border-color); color:var(--text-muted-color); border-radius:9999px; padding:.25rem .7rem; font-size:.78rem; cursor:pointer; transition: all .15s; user-select:none; }
        .chip.on { background: var(--accent-color); color:#fff; border-color: var(--accent-color); }
        .menu-row { display:flex; align-items:center; gap:.9rem; padding:.95rem 1rem; cursor:pointer; transition: background-color .15s; }
        .menu-row:hover { background: var(--accent-soft-color); }
        .menu-row + .menu-row { border-top: 1px solid var(--border-color); }
        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 10rem) !important; }
        .bottom-nav { padding-bottom: env(safe-area-inset-bottom); }
        a.exlink { color: var(--accent-color); }
    </style>
</head>
<body class="min-h-screen">

<!-- ============ 認証画面 ============ -->
<div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="serif text-4xl font-bold tracking-widest" style="color:var(--accent-color)">筆灯<span class="text-base align-top ml-1">ふでび</span></h1>
            <p class="text-sm mt-2" style="color:var(--text-muted-color)">小説家のための、静かな交流の場</p>
        </div>
        <div class="card rounded-2xl p-6 fade-in">
            <div class="flex mb-6 rounded-lg overflow-hidden border" style="border-color:var(--border-color)">
                <button id="tab-login" class="flex-1 py-2 text-sm font-semibold btn-accent">ログイン</button>
                <button id="tab-register" class="flex-1 py-2 text-sm font-semibold btn-ghost border-0">新規登録</button>
            </div>
            <form id="login-form" class="space-y-4">
                <div><label class="block text-xs mb-1" style="color:var(--text-muted-color)">メールアドレス</label>
                    <input type="email" id="login-email" required class="input-field w-full px-3 py-2 rounded-md" placeholder="you@example.com"></div>
                <div><label class="block text-xs mb-1" style="color:var(--text-muted-color)">パスワード</label>
                    <input type="password" id="login-password" required class="input-field w-full px-3 py-2 rounded-md" placeholder="••••••••"></div>
                <p id="login-error" class="text-xs text-rose-400 hidden"></p>
                <button type="submit" class="btn-accent w-full py-2.5 rounded-md font-semibold">ログイン</button>
                <p class="text-[11px] text-center" style="color:var(--text-muted-color)">パスワードをお忘れの場合の再設定（メール送信）は、本番版で対応予定です。</p>
            </form>
            <form id="register-form" class="space-y-4 hidden">
                <div><label class="block text-xs mb-1" style="color:var(--text-muted-color)">ペンネーム</label>
                    <input type="text" id="reg-penname" required maxlength="24" class="input-field w-full px-3 py-2 rounded-md" placeholder="例：夜長 灯"></div>
                <div><label class="block text-xs mb-1" style="color:var(--text-muted-color)">メールアドレス <span class="text-rose-400">*必須</span></label>
                    <input type="email" id="reg-email" required class="input-field w-full px-3 py-2 rounded-md" placeholder="you@example.com"></div>
                <div><label class="block text-xs mb-1" style="color:var(--text-muted-color)">パスワード（6文字以上）</label>
                    <input type="password" id="reg-password" required minlength="6" class="input-field w-full px-3 py-2 rounded-md" placeholder="••••••••"></div>
                <p id="reg-error" class="text-xs text-rose-400 hidden"></p>
                <button type="submit" class="btn-accent w-full py-2.5 rounded-md font-semibold">登録してはじめる</button>
            </form>
        </div>
        <p class="text-[11px] text-center mt-4 leading-relaxed" style="color:var(--text-muted-color)">
            <i class="fas fa-circle-info mr-1"></i>これは試作版です。アカウントや投稿はこの端末のブラウザ内にのみ保存され、他の端末とは共有されません。
        </p>
    </div>
</div>

<!-- ============ アプリ本体 ============ -->
<div id="app-screen" class="hidden">
    <header class="sticky top-0 z-20 border-b" style="background-color:var(--header-bg-color); border-color:var(--border-color)">
        <div class="max-w-2xl mx-auto px-4 h-14 flex items-center justify-between">
            <h1 data-action="nav" data-view="home" class="serif text-xl font-bold tracking-wider cursor-pointer select-none" style="color:var(--accent-color)" title="ホームへ"><i class="fas fa-book-bookmark mr-1 text-base"></i>筆灯</h1>
            <div class="flex items-center gap-2">
                <button data-action="bell" class="relative w-9 h-9 rounded-full btn-ghost flex items-center justify-center" title="通知">
                    <i class="fas fa-bell"></i>
                    <span id="bell-badge" class="hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full text-[10px] font-bold flex items-center justify-center text-white" style="background:var(--danger-color)"></span>
                </button>
                <div id="header-avatar" title="設定"></div>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-5 pb-safe">
        <!-- ホーム -->
        <section id="view-home" class="view space-y-4">
            <div class="card rounded-2xl p-6">
                <p class="text-sm" style="color:var(--text-muted-color)">おかえりなさい</p>
                <h2 id="home-greeting" class="serif text-2xl font-bold mt-1"></h2>
                <p class="text-sm mt-2" style="color:var(--text-muted-color)">今日も、ことばを紡ぎましょう。</p>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <button class="card rounded-2xl p-5 text-left transition" data-action="nav" data-view="koryu">
                    <i class="fas fa-comments text-2xl" style="color:var(--accent-color)"></i>
                    <p class="font-bold mt-3">交流</p><p class="text-xs mt-1" style="color:var(--text-muted-color)">仲間とつながる</p></button>
                <button class="card rounded-2xl p-5 text-left transition" data-action="nav" data-view="blog">
                    <i class="fas fa-book-open text-2xl" style="color:var(--accent-color)"></i>
                    <p class="font-bold mt-3">ブログ</p><p class="text-xs mt-1" style="color:var(--text-muted-color)">記事を読む・書く</p></button>
                <button class="card rounded-2xl p-5 text-left transition" data-action="nav" data-view="settings">
                    <i class="fas fa-gear text-2xl" style="color:var(--accent-color)"></i>
                    <p class="font-bold mt-3">設定</p><p class="text-xs mt-1" style="color:var(--text-muted-color)">プロフィール・管理</p></button>
                <div class="card rounded-2xl p-5">
                    <i class="fas fa-feather-pointed text-2xl" style="color:var(--accent-color)"></i>
                    <p class="font-bold mt-3"><span id="home-stat-posts">0</span> 投稿</p>
                    <p class="text-xs mt-1" style="color:var(--text-muted-color)"><span id="home-stat-blogs">0</span> 記事 / <span id="home-stat-users">0</span> 人</p></div>
            </div>
        </section>

        <!-- 交流 -->
        <section id="view-koryu" class="view hidden space-y-4">
            <div class="flex gap-2">
                <button data-action="feedtab" data-tab="all" class="feedtab btn-accent px-4 py-1.5 rounded-full text-sm font-semibold">すべて</button>
                <button data-action="feedtab" data-tab="following" class="feedtab btn-ghost px-4 py-1.5 rounded-full text-sm font-semibold">フォロー中</button>
            </div>
            <div class="card rounded-2xl p-4">
                <textarea id="post-input" rows="3" maxlength="1000" class="textarea-field w-full px-3 py-2 rounded-md resize-none" placeholder="いま考えていること、執筆の進捗など…"></textarea>
                <div class="flex justify-between items-center mt-2">
                    <span class="text-xs" style="color:var(--text-muted-color)"><i class="fas fa-users mr-1"></i>登録メンバーに公開されます</span>
                    <button data-action="post" class="btn-accent px-4 py-1.5 rounded-md text-sm font-semibold">投稿</button>
                </div>
            </div>
            <div id="feed-list" class="space-y-4"></div>
        </section>

        <!-- ブログ -->
        <section id="view-blog" class="view hidden space-y-4">
            <div id="blog-author-bar" class="hidden">
                <button data-action="blog-new" class="btn-accent w-full py-2.5 rounded-md font-semibold"><i class="fas fa-pen-nib mr-2"></i>新しい記事を書く</button>
            </div>
            <div id="blog-list" class="space-y-4"></div>
        </section>

        <!-- 動的ビュー（戻る付き） -->
        <section id="view-blog-detail" class="view hidden space-y-4"></section>
        <section id="view-blog-edit" class="view hidden space-y-4"></section>
        <section id="view-subpage" class="view hidden space-y-4"></section>
        <section id="view-profile" class="view hidden space-y-4"></section>
        <section id="view-notifications" class="view hidden space-y-4"></section>

        <!-- 設定トップ -->
        <section id="view-settings" class="view hidden space-y-4">
            <div class="card rounded-2xl overflow-hidden" id="settings-menu"></div>
            <button data-action="logout" class="btn-danger w-full py-2.5 rounded-md font-semibold"><i class="fas fa-right-from-bracket mr-2"></i>ログアウト</button>
            <p class="text-[11px] text-center" style="color:var(--text-muted-color)">筆灯 試作版 v0.3 ／ データはこの端末内に保存されます</p>
        </section>
    </main>

    <nav class="bottom-nav fixed bottom-0 left-0 right-0 z-20 border-t" style="background-color:var(--header-bg-color); border-color:var(--border-color)">
        <div class="max-w-2xl mx-auto grid grid-cols-4">
            <button class="nav-btn flex flex-col items-center py-2.5 gap-0.5" data-action="nav" data-view="home"><i class="fas fa-house nav-icon text-lg"></i><span class="text-[11px]">ホーム</span></button>
            <button class="nav-btn flex flex-col items-center py-2.5 gap-0.5" data-action="nav" data-view="koryu"><i class="fas fa-comments nav-icon text-lg"></i><span class="text-[11px]">交流</span></button>
            <button class="nav-btn flex flex-col items-center py-2.5 gap-0.5" data-action="nav" data-view="blog"><i class="fas fa-book-open nav-icon text-lg"></i><span class="text-[11px]">ブログ</span></button>
            <button class="nav-btn flex flex-col items-center py-2.5 gap-0.5" data-action="nav" data-view="settings"><i class="fas fa-gear nav-icon text-lg"></i><span class="text-[11px]">設定</span></button>
        </div>
    </nav>
</div>

<div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full text-sm font-semibold text-white hidden text-center" style="background-color:var(--accent-color)"></div>

<script>
/* =========================================================
   筆灯 (Fudebi) — 小説家の交流サイト 試作版 v0.3
   データは localStorage に保存（この端末のみ）。
   ※試作のためパスワードは簡易ハッシュです。本番運用時は
     クラウド/サーバー側の認証に置き換えてください。
   ========================================================= */
(function () {
    'use strict';
    const KEYS = { users:'fudebi_users', session:'fudebi_session', posts:'fudebi_posts', blogs:'fudebi_blogs', notifs:'fudebi_notifs', reports:'fudebi_reports', feedbacks:'fudebi_feedbacks', banned:'fudebi_banned' };
    const GENRES = ['恋愛','ファンタジー','SF','ミステリ','ホラー','時代・歴史','現代ドラマ','エッセイ','詩・短歌','ライト文芸','二次創作','BL','GL','ノンフィクション'];
    const LINK_PRESETS = ['カクヨム','小説家になろう','pixiv','X (Twitter)','note','個人サイト'];

    const load = (k, def) => { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } };
    const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));

    let users   = load(KEYS.users, []);
    let posts   = load(KEYS.posts, []);
    let blogs   = load(KEYS.blogs, []);
    let notifs    = load(KEYS.notifs, []);
    let reports   = load(KEYS.reports, []);
    let feedbacks = load(KEYS.feedbacks, []);
    let banned    = load(KEYS.banned, []);   // BANされたメールアドレス一覧
    let session   = load(KEYS.session, null);

    // 旧データの補完
    users.forEach(u => {
        u.bio = u.bio || ''; u.genres = u.genres || []; u.links = u.links || [];
        u.following = u.following || []; u.followers = u.followers || []; u.blocked = u.blocked || [];
        u.muteWords = u.muteWords || []; if (u.blogComments === undefined) u.blogComments = true;
    });

    const persist = () => { save(KEYS.users, users); save(KEYS.posts, posts); save(KEYS.blogs, blogs); save(KEYS.notifs, notifs); save(KEYS.reports, reports); save(KEYS.feedbacks, feedbacks); save(KEYS.banned, banned); save(KEYS.session, session); };

    const $  = (s, el=document) => el.querySelector(s);
    const $$ = (s, el=document) => [...el.querySelectorAll(s)];
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    const esc = (s='') => (''+s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const me = () => users.find(u => u.id === session) || null;
    const userById = id => users.find(u => u.id === id) || null;

    function hash(str){ let h=5381; for(let i=0;i<str.length;i++) h=((h<<5)+h+str.charCodeAt(i))>>>0; return h.toString(16); }
    const COLORS = ['#a78bfa','#f59e0b','#34d399','#60a5fa','#f472b6','#fb7185','#38bdf8','#c084fc'];
    const colorFor = id => COLORS[[...(''+id)].reduce((a,c)=>a+c.charCodeAt(0),0) % COLORS.length];
    const initial = name => (name||'？').trim().charAt(0).toUpperCase();
    function timeAgo(ts){ const d=(Date.now()-ts)/1000; if(d<60)return 'たった今'; if(d<3600)return Math.floor(d/60)+'分前'; if(d<86400)return Math.floor(d/3600)+'時間前'; if(d<604800)return Math.floor(d/86400)+'日前'; return new Date(ts).toLocaleDateString('ja-JP'); }
    const fmtDate = ts => new Date(ts).toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'});
    const validUrl = u => /^https?:\/\/.+/i.test(u);
    const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

    function avatar(user, size='w-9 h-9 text-sm', clickable=false){
        if(!user) return `<div class="avatar ${size} rounded-full" style="background:#888">？</div>`;
        const cl = clickable ? `data-action="open-profile" data-id="${user.id}" style="background:${colorFor(user.id)};cursor:pointer"` : `style="background:${colorFor(user.id)}"`;
        return `<div class="avatar ${size} rounded-full" ${cl}>${esc(initial(user.penname))}</div>`;
    }
    function nameTag(user, clickable=true){
        if(!user) return `<span class="font-semibold">退会者</span>`;
        const cl = clickable ? `data-action="open-profile" data-id="${user.id}" class="font-semibold cursor-pointer hover:underline"` : `class="font-semibold"`;
        return `<span ${cl}>${esc(user.penname)}</span>${roleBadge(user.role)}`;
    }
    function roleBadge(role){ if(role==='admin')return ' <span class="badge badge-admin">管理人</span>'; if(role==='author')return ' <span class="badge badge-author">ブロガー</span>'; return ''; }
    const canWriteBlog = u => u && (u.role==='admin'||u.role==='author');

    // ブロック・ミュート
    const blockedEither = (aId,bId) => { const a=userById(aId), b=userById(bId); return (a&&a.blocked.includes(bId))||(b&&b.blocked.includes(aId)); };
    const hasMute = (text,words) => words.some(w => w && (''+text).toLowerCase().includes(w.toLowerCase()));

    let toastTimer;
    function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.add('hidden'),2400); }

    // ================= 通知 =================
    function addNotif(toId, type, fromId, refId){ if(toId===fromId) return; notifs.push({id:uid(),toId,type,fromId,refId,createdAt:Date.now(),read:false}); }
    function removeNotif(toId,type,fromId,refId){ notifs = notifs.filter(n => !(n.toId===toId&&n.type===type&&n.fromId===fromId&&n.refId===refId)); }
    const myUnread = () => notifs.filter(n => n.toId===session && !n.read).length;
    function updateBell(){ const n=myUnread(); const b=$('#bell-badge'); if(n>0){ b.textContent=n>99?'99+':n; b.classList.remove('hidden'); } else b.classList.add('hidden'); }

    // ================= ナビゲーション =================
    const TOP_VIEWS = ['home','koryu','blog','settings'];
    let hist = [];
    function showView(id){ $$('.view').forEach(v=>v.classList.add('hidden')); const el=$('#view-'+id); if(el){ el.classList.remove('hidden'); el.classList.add('fade-in'); el.classList.remove('fade-in'); void el.offsetWidth; el.classList.add('fade-in'); } }
    function setNavActive(){ const root = hist[0] ? hist[0].view : 'home'; $$('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===root)); }
    function navTo(view){ hist=[{view, render: TOP_RENDER[view]}]; showView(view); if(TOP_RENDER[view]) TOP_RENDER[view](); setNavActive(); window.scrollTo({top:0}); }
    function push(view, render){ hist.push({view, render}); showView(view); if(render) render(); setNavActive(); window.scrollTo({top:0}); }
    function back(){ if(hist.length>1){ hist.pop(); const c=hist[hist.length-1]; showView(c.view); if(c.render) c.render(); setNavActive(); window.scrollTo({top:0}); } else navTo('home'); }
    const backBar = label => `<button data-action="back" class="btn-ghost px-3 py-1.5 rounded-md text-sm"><i class="fas fa-arrow-left mr-1"></i>${label||'戻る'}</button>`;

    const TOP_RENDER = { home:renderHome, koryu:renderKoryu, blog:renderBlog, settings:renderSettings };

    // ================= 認証 =================
    function showAuth(){ $('#auth-screen').classList.remove('hidden'); $('#app-screen').classList.add('hidden'); }
    function showApp(){ $('#auth-screen').classList.add('hidden'); $('#app-screen').classList.remove('hidden'); renderHeader(); updateBell(); navTo('home'); }

    $('#tab-login').addEventListener('click', ()=>{ $('#login-form').classList.remove('hidden'); $('#register-form').classList.add('hidden'); $('#tab-login').className='flex-1 py-2 text-sm font-semibold btn-accent'; $('#tab-register').className='flex-1 py-2 text-sm font-semibold btn-ghost border-0'; });
    $('#tab-register').addEventListener('click', ()=>{ $('#register-form').classList.remove('hidden'); $('#login-form').classList.add('hidden'); $('#tab-register').className='flex-1 py-2 text-sm font-semibold btn-accent'; $('#tab-login').className='flex-1 py-2 text-sm font-semibold btn-ghost border-0'; });

    $('#register-form').addEventListener('submit', e=>{
        e.preventDefault();
        const penname=$('#reg-penname').value.trim(), email=$('#reg-email').value.trim().toLowerCase(), pw=$('#reg-password').value, err=$('#reg-error');
        err.classList.add('hidden');
        if(!penname||!email||pw.length<6){ err.textContent='入力内容を確認してください。'; err.classList.remove('hidden'); return; }
        if(!validEmail(email)){ err.textContent='正しいメールアドレスを入力してください。'; err.classList.remove('hidden'); return; }
        if(banned.includes(email)){ err.textContent='このメールアドレスはご利用いただけません。'; err.classList.remove('hidden'); return; }
        if(users.some(u=>u.email===email)){ err.textContent='このメールアドレスは既に登録されています。'; err.classList.remove('hidden'); return; }
        const isFirst=users.length===0;
        users.push({ id:uid(), penname, email, pw:hash(pw), role:isFirst?'admin':'member', bio:'', genres:[], links:[], following:[], followers:[], blocked:[], muteWords:[], blogComments:true, createdAt:Date.now() });
        session=users[users.length-1].id; persist(); e.target.reset(); showApp();
        toast(isFirst?'管理人として登録しました':'ようこそ、筆灯へ');
    });
    $('#login-form').addEventListener('submit', e=>{
        e.preventDefault();
        const email=$('#login-email').value.trim().toLowerCase(), pw=$('#login-password').value, err=$('#login-error');
        err.classList.add('hidden');
        if(banned.includes(email)){ err.textContent='このメールアドレスはご利用いただけません。'; err.classList.remove('hidden'); return; }
        const u=users.find(x=>x.email===email);
        if(!u||u.pw!==hash(pw)){ err.textContent='メールアドレスまたはパスワードが違います。'; err.classList.remove('hidden'); return; }
        session=u.id; persist(); e.target.reset(); showApp(); toast('おかえりなさい');
    });

    // ================= ヘッダー / ホーム =================
    function renderHeader(){ $('#header-avatar').innerHTML = `<div data-action="nav" data-view="settings" style="cursor:pointer" title="設定">${avatar(me(),'w-9 h-9 text-sm',false)}</div>`; }
    function renderHome(){ const u=me(); if(!u)return; $('#home-greeting').textContent=u.penname+' さん'; $('#home-stat-posts').textContent=posts.length; $('#home-stat-blogs').textContent=blogs.length; $('#home-stat-users').textContent=users.length; }

    // ================= 交流（SNS） =================
    let feedTab = 'all';
    function renderKoryu(){ $$('.feedtab').forEach(b=>{ const on=b.dataset.tab===feedTab; b.className=`feedtab ${on?'btn-accent':'btn-ghost'} px-4 py-1.5 rounded-full text-sm font-semibold`; }); renderFeed(); }

    function postCard(p){
        const a=userById(p.authorId), liked=p.likes.includes(session), u=me();
        const comments=(p.comments||[]).filter(c=>!blockedEither(session,c.authorId)&&!hasMute(c.body,u.muteWords)).map(c=>{
            const ca=userById(c.authorId);
            return `<div class="flex gap-2 mt-2">${avatar(ca,'w-7 h-7 text-xs',true)}
                <div class="flex-1 rounded-lg px-3 py-2" style="background:var(--bg-color)">
                    <div class="flex items-center gap-2 text-xs">${nameTag(ca)}<span class="text-[10px]" style="color:var(--text-muted-color)">${timeAgo(c.createdAt)}</span>
                    ${ca&&ca.id!==session?`<button data-action="report" data-rtype="comment" data-id="${c.id}" data-post="${p.id}" class="ml-auto text-[10px]" style="color:var(--text-muted-color)" title="通報"><i class="fas fa-flag"></i></button>`:''}</div>
                    <p class="text-sm mt-0.5 whitespace-pre-wrap break-words">${esc(c.body)}</p>
                </div></div>`;
        }).join('');
        return `<div class="card rounded-2xl p-4 fade-in"><div class="flex gap-3">${avatar(a,'w-9 h-9 text-sm',true)}
            <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 flex-wrap text-sm">${nameTag(a)}<span class="text-xs" style="color:var(--text-muted-color)">${timeAgo(p.createdAt)}</span>
                    ${p.authorId===session?`<button data-action="del-post" data-id="${p.id}" class="ml-auto text-xs" style="color:var(--text-muted-color)" title="削除"><i class="fas fa-trash"></i></button>`:`<button data-action="report" data-rtype="post" data-id="${p.id}" class="ml-auto text-xs" style="color:var(--text-muted-color)" title="通報"><i class="fas fa-flag"></i></button>`}
                </div>
                <p class="mt-1 whitespace-pre-wrap break-words">${esc(p.body)}</p>
                <div class="flex items-center gap-4 mt-3 text-sm" style="color:var(--text-muted-color)">
                    <button data-action="like" data-id="${p.id}" class="flex items-center gap-1" style="${liked?'color:var(--accent-color)':''}"><i class="fa${liked?'s':'r'} fa-heart"></i><span>${p.likes.length||''}</span></button>
                    <button data-action="toggle-comment" data-id="${p.id}" class="flex items-center gap-1"><i class="far fa-comment"></i><span>${(p.comments||[]).length||''}</span></button>
                </div>
                <div class="comments mt-2 hidden" data-id="${p.id}">${comments}
                    <div class="flex gap-2 mt-3">
                        <input type="text" class="comment-input input-field flex-1 px-3 py-1.5 rounded-md text-sm" data-id="${p.id}" placeholder="コメントを書く…" maxlength="500">
                        <button data-action="comment-send" data-id="${p.id}" class="btn-accent px-3 rounded-md text-sm">送信</button>
                    </div>
                </div>
            </div></div></div>`;
    }
    function renderFeed(){
        const u=me(); const list=$('#feed-list');
        let vis=posts.filter(p=>!blockedEither(session,p.authorId)&&!hasMute(p.body,u.muteWords));
        if(feedTab==='following') vis=vis.filter(p=>u.following.includes(p.authorId)||p.authorId===session);
        if(!vis.length){ list.innerHTML=emptyState('fa-comments', feedTab==='following'?'フォロー中の投稿がありません':'まだ投稿がありません', feedTab==='following'?'気になる人をフォローしてみましょう。':'最初のひとことを投稿してみましょう。'); return; }
        list.innerHTML=vis.map(postCard).join('');
    }

    // ================= ブログ =================
    function renderBlog(){
        $('#blog-author-bar').classList.toggle('hidden', !canWriteBlog(me()));
        const list=$('#blog-list');
        if(!blogs.length){ list.innerHTML=emptyState('fa-book-open','まだ記事がありません', canWriteBlog(me())?'「新しい記事を書く」から投稿できます。':'管理人・ブロガーの記事がここに並びます。'); return; }
        list.innerHTML=blogs.map(b=>{ const a=userById(b.authorId); const prev=b.body.replace(/\s+/g,' ').slice(0,90);
            return `<button data-action="open-blog" data-id="${b.id}" class="card rounded-2xl p-5 w-full text-left transition fade-in">
                <h3 class="serif text-lg font-bold leading-snug">${esc(b.title)}</h3>
                <p class="text-sm mt-2" style="color:var(--text-muted-color)">${esc(prev)}${b.body.length>90?'…':''}</p>
                <div class="flex items-center gap-2 mt-3 text-xs">${avatar(a,'w-6 h-6 text-xs')}<span class="font-semibold">${esc(a?a.penname:'退会者')}</span>${roleBadge(a&&a.role)}
                    <span style="color:var(--text-muted-color)">${fmtDate(b.createdAt)}</span>
                    <span class="ml-auto" style="color:var(--text-muted-color)"><i class="far fa-comment mr-1"></i>${(b.comments||[]).length}</span></div>
            </button>`; }).join('');
    }
    function renderBlogDetail(id){
        const b=blogs.find(x=>x.id===id); if(!b){ back(); return; }
        const a=userById(b.authorId), u=me();
        const canDel=u&&(u.id===b.authorId||u.role==='admin');
        const allowComment = !a || a.blogComments;
        const comments=(b.comments||[]).filter(c=>!blockedEither(session,c.authorId)).map(c=>{ const ca=userById(c.authorId);
            return `<div class="flex gap-2 mt-3">${avatar(ca,'w-7 h-7 text-xs',true)}
                <div class="flex-1 rounded-lg px-3 py-2" style="background:var(--bg-color)">
                    <div class="flex items-center gap-2 text-xs">${nameTag(ca)}<span class="text-[10px]" style="color:var(--text-muted-color)">${timeAgo(c.createdAt)}</span></div>
                    <p class="text-sm mt-0.5 whitespace-pre-wrap break-words">${esc(c.body)}</p></div></div>`; }).join('');
        $('#view-blog-detail').innerHTML = `${backBar('記事一覧')}
            <article class="card rounded-2xl p-6">
                <h1 class="serif text-2xl font-bold leading-snug">${esc(b.title)}</h1>
                <div class="flex items-center gap-2 mt-3 mb-5 pb-5 border-b" style="border-color:var(--border-color)">${avatar(a,'w-8 h-8 text-sm',true)}
                    <div><div class="flex items-center gap-2 text-sm">${nameTag(a)}</div><span class="text-xs" style="color:var(--text-muted-color)">${fmtDate(b.createdAt)}</span></div>
                    ${canDel?`<button data-action="del-blog" data-id="${b.id}" class="ml-auto btn-ghost px-3 py-1.5 rounded-md text-xs"><i class="fas fa-trash mr-1"></i>削除</button>`:`<button data-action="report" data-rtype="blog" data-id="${b.id}" class="ml-auto btn-ghost px-3 py-1.5 rounded-md text-xs"><i class="fas fa-flag mr-1"></i>通報</button>`}
                </div>
                <div class="blog-body serif">${esc(b.body)}</div>
            </article>
            <div class="card rounded-2xl p-5">
                <h3 class="font-bold mb-2"><i class="far fa-comment mr-2" style="color:var(--accent-color)"></i>コメント（${(b.comments||[]).length}）</h3>
                <div>${comments || `<p class="text-sm" style="color:var(--text-muted-color)">${allowComment?'最初のコメントを書いてみましょう。':''}</p>`}</div>
                ${allowComment?`<div class="flex gap-2 mt-4"><input type="text" id="blog-comment-input" class="input-field flex-1 px-3 py-2 rounded-md text-sm" placeholder="コメントを書く…" maxlength="500"><button data-action="blog-comment-send" data-id="${b.id}" class="btn-accent px-4 rounded-md text-sm font-semibold">送信</button></div>`
                    : `<p class="text-sm mt-3" style="color:var(--text-muted-color)"><i class="fas fa-comment-slash mr-1"></i>この記事ではコメントを受け付けていません。</p>`}
            </div>`;
    }
    function renderBlogEdit(id){
        const b = id ? blogs.find(x=>x.id===id) : null;
        $('#view-blog-edit').innerHTML = `${backBar('戻る')}
            <div class="card rounded-2xl p-5 space-y-4">
                <h2 class="serif text-xl font-bold">${b?'記事を編集':'記事を書く'}</h2>
                <input type="text" id="blog-edit-title" maxlength="80" class="input-field w-full px-3 py-2 rounded-md" placeholder="タイトル" value="${b?esc(b.title):''}">
                <textarea id="blog-edit-body" rows="14" maxlength="20000" class="textarea-field w-full px-3 py-2 rounded-md serif resize-none" placeholder="本文（改行はそのまま反映されます）">${b?esc(b.body):''}</textarea>
                <div class="flex justify-end gap-2"><button data-action="back" class="btn-ghost px-4 py-2 rounded-md text-sm">キャンセル</button>
                <button data-action="blog-publish" data-id="${b?b.id:''}" class="btn-accent px-4 py-2 rounded-md text-sm font-semibold">${b?'更新する':'公開する'}</button></div>
            </div>`;
    }

    // ================= 公開プロフィール =================
    function renderProfile(userId){
        const p=userById(userId); const u=me();
        if(!p){ $('#view-profile').innerHTML=`${backBar()}<div class="card rounded-2xl p-6 text-center" style="color:var(--text-muted-color)">このユーザーは見つかりませんでした。</div>`; return; }
        const isMe=p.id===u.id;
        const iFollow=u.following.includes(p.id);
        const iBlock=u.blocked.includes(p.id);
        const links=(p.links||[]).filter(l=>l.url).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer" class="exlink inline-flex items-center gap-1 text-sm underline break-all"><i class="fas fa-link text-xs"></i>${esc(l.label||l.url)}</a>`).join('<span class="mx-2" style="color:var(--border-color)">|</span>');
        const genres=(p.genres||[]).map(g=>`<span class="chip on">${esc(g)}</span>`).join(' ');
        const theirPosts = isMe||!iBlock ? posts.filter(x=>x.authorId===p.id).slice(0,20) : [];
        let actions='';
        if(!isMe){
            actions = `<div class="flex gap-2 mt-4">
                ${iBlock?`<button data-action="unblock" data-id="${p.id}" class="btn-ghost flex-1 py-2 rounded-md text-sm font-semibold">ブロック解除</button>`
                : `${iFollow?`<button data-action="unfollow" data-id="${p.id}" class="btn-ghost flex-1 py-2 rounded-md text-sm font-semibold">フォロー中</button>`:`<button data-action="follow" data-id="${p.id}" class="btn-accent flex-1 py-2 rounded-md text-sm font-semibold">フォロー</button>`}
                    <button data-action="block" data-id="${p.id}" class="btn-ghost px-3 py-2 rounded-md text-sm" title="ブロック"><i class="fas fa-ban"></i></button>
                    <button data-action="report" data-rtype="user" data-id="${p.id}" class="btn-ghost px-3 py-2 rounded-md text-sm" title="通報"><i class="fas fa-flag"></i></button>`}
            </div>`;
        }
        $('#view-profile').innerHTML = `${backBar()}
            <div class="card rounded-2xl p-6">
                <div class="flex items-center gap-4">${avatar(p,'w-16 h-16 text-2xl')}
                    <div class="min-w-0"><div class="flex items-center gap-2 flex-wrap"><span class="text-xl font-bold truncate">${esc(p.penname)}</span>${roleBadge(p.role)}</div>
                        <div class="text-sm mt-1" style="color:var(--text-muted-color)"><span class="font-semibold" style="color:var(--text-color)">${p.following.length}</span> フォロー　<span class="font-semibold" style="color:var(--text-color)">${p.followers.length}</span> フォロワー</div>
                    </div></div>
                ${iBlock&&!isMe?'<p class="text-xs mt-3 text-rose-400"><i class="fas fa-ban mr-1"></i>このユーザーをブロックしています</p>':''}
                ${p.bio?`<p class="mt-4 whitespace-pre-wrap break-words text-sm">${esc(p.bio)}</p>`:''}
                ${genres?`<div class="flex flex-wrap gap-2 mt-4">${genres}</div>`:''}
                ${links?`<div class="mt-4 flex flex-wrap items-center">${links}</div>`:''}
                ${actions}
            </div>
            <h3 class="font-bold px-1"><i class="fas fa-feather-pointed mr-2" style="color:var(--accent-color)"></i>${isMe?'あなた':esc(p.penname)+' さん'}の投稿</h3>
            <div class="space-y-4">${theirPosts.length?theirPosts.map(postCard).join(''):`<div class="card rounded-2xl p-6 text-center text-sm" style="color:var(--text-muted-color)">投稿はまだありません。</div>`}</div>`;
    }

    // ================= 通知一覧 =================
    function renderNotifications(){
        const mine = notifs.filter(n=>n.toId===session).sort((a,b)=>b.createdAt-a.createdAt);
        const TXT = { like:'さんがあなたの投稿にいいねしました', comment:'さんがあなたの投稿にコメントしました', blogcomment:'さんがあなたの記事にコメントしました', follow:'さんがあなたをフォローしました' };
        const ICON = { like:'fa-heart', comment:'fa-comment', blogcomment:'fa-comment-dots', follow:'fa-user-plus' };
        const body = mine.length ? mine.map(n=>{ const f=userById(n.fromId);
            return `<div class="card rounded-xl p-3 flex items-center gap-3 ${n.read?'':'border-l-4'}" ${n.read?'':'style="border-left-color:var(--accent-color)"'}>
                ${avatar(f,'w-9 h-9 text-sm',true)}
                <div class="flex-1 min-w-0 text-sm"><i class="fas ${ICON[n.type]} mr-1" style="color:var(--accent-color)"></i>
                    <span class="font-semibold cursor-pointer hover:underline" data-action="open-profile" data-id="${n.fromId}">${esc(f?f.penname:'退会者')}</span> ${TXT[n.type]||''}
                    <div class="text-[11px] mt-0.5" style="color:var(--text-muted-color)">${timeAgo(n.createdAt)}</div></div>
                ${(n.type==='blogcomment')?`<button data-action="open-blog" data-id="${n.refId}" class="btn-ghost px-2 py-1 rounded text-xs">見る</button>`:''}
            </div>`; }).join('') : emptyState('fa-bell','通知はありません','いいねやコメント、フォローがあるとここに表示されます。');
        $('#view-notifications').innerHTML = `${backBar()}<h2 class="font-bold px-1 text-lg">通知</h2><div class="space-y-2">${body}</div>`;
        notifs.forEach(n=>{ if(n.toId===session) n.read=true; }); persist(); updateBell();
    }

    // ================= 設定 トップ =================
    function settingsMenuItems(){
        const items=[
            {p:'account',  i:'fa-id-card',        t:'登録内容確認',     d:'メールアドレス・サブスク'},
            {p:'profile',  i:'fa-user-pen',       t:'プロフィール設定', d:'ペンネーム・ジャンル・URL・フォロー'},
            {p:'security', i:'fa-shield-halved',  t:'セキュリティ設定', d:'パスワード変更・退会'},
            {p:'interaction', i:'fa-comments',    t:'交流設定',         d:'ブロック・ミュートワード'},
            {p:'blog',     i:'fa-book',           t:'ブログ設定',       d:'自分の記事・コメント受付'},
            {p:'data',     i:'fa-database',       t:'データ',           d:'バックアップ・復元'},
            {p:'other',    i:'fa-circle-info',    t:'その他',           d:'規約・お問い合わせ・バージョン'},
        ];
        if(me() && me().role==='admin') items.splice(5,0,{p:'admin', i:'fa-crown', t:'管理人メニュー', d:'ユーザー管理・ユーザーからの声・通報'});
        return items;
    }
    function renderSettings(){
        $('#settings-menu').innerHTML = settingsMenuItems().map(m=>`
            <div class="menu-row" data-action="subpage" data-page="${m.p}">
                <i class="fas ${m.i} fa-fw text-lg" style="color:var(--accent-color)"></i>
                <div class="flex-1 min-w-0"><p class="font-semibold">${m.t}</p><p class="text-xs" style="color:var(--text-muted-color)">${m.d}</p></div>
                <i class="fas fa-chevron-right text-xs" style="color:var(--text-muted-color)"></i>
            </div>`).join('');
    }

    // ----- 設定 各ページ -----
    function openSubpage(page){ push('subpage', ()=>renderSubpage(page)); }
    function renderSubpage(page){
        const u=me();
        const wrap = (title, inner) => `${backBar('設定')}<h2 class="font-bold px-1 text-lg mb-1">${title}</h2>${inner}`;
        let html='';
        if(page==='account'){
            html = wrap('登録内容確認', `
                <div class="card rounded-2xl p-5 space-y-2"><p class="text-xs" style="color:var(--text-muted-color)">登録メールアドレス</p><p class="font-semibold break-all">${esc(u.email)}</p></div>
                <div class="card rounded-2xl p-5 space-y-3 mt-4"><h3 class="font-bold">メールアドレスの変更</h3>
                    <input type="email" id="acc-email" class="input-field w-full px-3 py-2 rounded-md" value="${esc(u.email)}">
                    <button data-action="save-email" class="btn-accent px-4 py-2 rounded-md text-sm font-semibold">変更を保存</button></div>
                <div class="card rounded-2xl p-5 mt-4"><h3 class="font-bold mb-1"><i class="fas fa-crown mr-2 text-amber-400"></i>サブスクリプション</h3>
                    <p class="text-sm" style="color:var(--text-muted-color)">現在は無料でご利用いただけます。将来的に、応援・特典つきの有料プランを検討中です。</p></div>`);
        } else if(page==='profile'){
            html = wrap('プロフィール設定', `
                <div class="card rounded-2xl p-5 space-y-4">
                    <div><label class="block text-xs mb-1" style="color:var(--text-muted-color)">ペンネーム</label><input type="text" id="pf-penname" maxlength="24" class="input-field w-full px-3 py-2 rounded-md" value="${esc(u.penname)}"></div>
                    <div><label class="block text-xs mb-1" style="color:var(--text-muted-color)">自己紹介</label><textarea id="pf-bio" rows="3" maxlength="300" class="textarea-field w-full px-3 py-2 rounded-md resize-none" placeholder="作風や、好きな作家など">${esc(u.bio)}</textarea></div>
                    <div><label class="block text-xs mb-2" style="color:var(--text-muted-color)">好きなジャンル（複数選択可）</label><div id="pf-genres" class="flex flex-wrap gap-2">${GENRES.map(g=>`<span class="chip ${u.genres.includes(g)?'on':''}" data-genre="${esc(g)}">${esc(g)}</span>`).join('')}</div></div>
                    <div><label class="block text-xs mb-2" style="color:var(--text-muted-color)">URL置き場</label><div id="pf-links" class="space-y-2"></div>
                        <button data-action="add-link" class="btn-ghost px-3 py-1.5 rounded-md text-xs mt-2"><i class="fas fa-plus mr-1"></i>リンクを追加</button></div>
                    <button data-action="save-profile" class="btn-accent px-4 py-2 rounded-md text-sm font-semibold">プロフィールを保存</button>
                    <p id="pf-saved" class="text-xs text-emerald-400 hidden">保存しました。</p>
                </div>
                <div class="card rounded-2xl overflow-hidden mt-4">
                    <div class="menu-row" data-action="open-profile" data-id="${u.id}"><i class="fas fa-eye fa-fw" style="color:var(--accent-color)"></i><div class="flex-1">自分の公開プロフィールを見る</div><i class="fas fa-chevron-right text-xs" style="color:var(--text-muted-color)"></i></div>
                    <div class="menu-row" data-action="subpage" data-page="following"><i class="fas fa-user-group fa-fw" style="color:var(--accent-color)"></i><div class="flex-1">フォロー中 <span style="color:var(--text-muted-color)">(${u.following.length})</span></div><i class="fas fa-chevron-right text-xs" style="color:var(--text-muted-color)"></i></div>
                    <div class="menu-row" data-action="subpage" data-page="followers"><i class="fas fa-users fa-fw" style="color:var(--accent-color)"></i><div class="flex-1">フォロワー <span style="color:var(--text-muted-color)">(${u.followers.length})</span></div><i class="fas fa-chevron-right text-xs" style="color:var(--text-muted-color)"></i></div>
                </div>`);
        } else if(page==='security'){
            html = wrap('セキュリティ設定', `
                <div class="card rounded-2xl p-5 space-y-3"><h3 class="font-bold">パスワードの変更</h3>
                    <input type="password" id="sec-cur" class="input-field w-full px-3 py-2 rounded-md" placeholder="現在のパスワード">
                    <input type="password" id="sec-new" class="input-field w-full px-3 py-2 rounded-md" placeholder="新しいパスワード（6文字以上）">
                    <input type="password" id="sec-new2" class="input-field w-full px-3 py-2 rounded-md" placeholder="新しいパスワード（確認）">
                    <p id="sec-msg" class="text-xs hidden"></p>
                    <button data-action="save-password" class="btn-accent px-4 py-2 rounded-md text-sm font-semibold">変更する</button></div>
                <div class="card rounded-2xl p-5 mt-4"><h3 class="font-bold text-rose-400 mb-1"><i class="fas fa-triangle-exclamation mr-1"></i>アカウントの削除（退会）</h3>
                    <p class="text-sm mb-3" style="color:var(--text-muted-color)">退会するとアカウントは削除され、元に戻せません。投稿・記事は「退会者」名義で残る場合があります。</p>
                    <button data-action="delete-account" class="btn-danger px-4 py-2 rounded-md text-sm font-semibold">退会する</button></div>`);
        } else if(page==='interaction'){
            const blocked=u.blocked.map(id=>userById(id)).filter(Boolean);
            html = wrap('交流設定', `
                <div class="card rounded-2xl p-5"><h3 class="font-bold mb-3"><i class="fas fa-ban mr-2"></i>ブロックしたユーザー</h3>
                    <div class="space-y-2">${blocked.length?blocked.map(b=>`<div class="flex items-center gap-2 rounded-lg px-3 py-2" style="background:var(--bg-color)">${avatar(b,'w-7 h-7 text-xs',true)}<span class="text-sm font-semibold flex-1 truncate">${esc(b.penname)}</span><button data-action="unblock" data-id="${b.id}" class="btn-ghost text-xs px-2 py-1 rounded">解除</button></div>`).join(''):`<p class="text-sm" style="color:var(--text-muted-color)">ブロックしているユーザーはいません。</p>`}</div></div>
                <div class="card rounded-2xl p-5 mt-4"><h3 class="font-bold mb-1"><i class="fas fa-comment-slash mr-2"></i>ミュートワード</h3>
                    <p class="text-xs mb-3" style="color:var(--text-muted-color)">指定した語を含む投稿・コメントは、交流画面に表示されなくなります（相手に通知は届きません）。</p>
                    <div class="flex gap-2"><input type="text" id="mute-input" class="input-field flex-1 px-3 py-2 rounded-md text-sm" placeholder="例：ネタバレ" maxlength="40"><button data-action="add-mute" class="btn-accent px-4 rounded-md text-sm font-semibold">追加</button></div>
                    <div id="mute-list" class="flex flex-wrap gap-2 mt-3">${u.muteWords.map(w=>`<span class="chip on">${esc(w)} <i class="fas fa-xmark ml-1 cursor-pointer" data-action="del-mute" data-word="${esc(w)}"></i></span>`).join('')||`<span class="text-sm" style="color:var(--text-muted-color)">登録されていません。</span>`}</div></div>`);
        } else if(page==='blog'){
            const mine=blogs.filter(b=>b.authorId===u.id);
            html = wrap('ブログ設定', `
                <div class="card rounded-2xl p-5 flex items-center gap-3"><div class="flex-1"><h3 class="font-bold">記事へのコメントを受け付ける</h3><p class="text-xs" style="color:var(--text-muted-color)">オフにすると、自分の記事にコメントできなくなります。</p></div>
                    <button data-action="toggle-blog-comments" class="px-1" title="切替"><i class="fas ${u.blogComments?'fa-toggle-on':'fa-toggle-off'} text-3xl" style="color:${u.blogComments?'var(--accent-color)':'var(--text-muted-color)'}"></i></button></div>
                ${canWriteBlog(u)?`<div class="card rounded-2xl p-5 mt-4"><h3 class="font-bold mb-3">自分の記事</h3>
                    <div class="space-y-2">${mine.length?mine.map(b=>`<div class="flex items-center gap-2 rounded-lg px-3 py-2" style="background:var(--bg-color)"><span class="text-sm flex-1 truncate cursor-pointer" data-action="open-blog" data-id="${b.id}">${esc(b.title)}</span><button data-action="edit-blog" data-id="${b.id}" class="btn-ghost text-xs px-2 py-1 rounded">編集</button><button data-action="del-blog" data-id="${b.id}" class="btn-ghost text-xs px-2 py-1 rounded">削除</button></div>`).join(''):`<p class="text-sm" style="color:var(--text-muted-color)">まだ記事がありません。</p>`}</div></div>`
                    :`<div class="card rounded-2xl p-5 mt-4 text-sm" style="color:var(--text-muted-color)">ブログ記事は管理人・ブロガーが投稿できます。執筆をご希望の場合は管理人にご連絡ください。</div>`}`);
        } else if(page==='data'){
            html = wrap('データ', `<div class="card rounded-2xl p-5"><p class="text-sm mb-3" style="color:var(--text-muted-color)">この端末のデータをバックアップ・復元できます。試作版では端末内にのみ保存されるため、定期的なエクスポートをおすすめします。</p>
                <div class="flex flex-wrap gap-2"><button data-action="export" class="btn-ghost px-4 py-2 rounded-md text-sm"><i class="fas fa-download mr-1"></i>エクスポート</button>
                <label class="btn-ghost px-4 py-2 rounded-md text-sm cursor-pointer"><i class="fas fa-upload mr-1"></i>インポート<input type="file" id="import-input" accept="application/json" class="hidden"></label></div></div>`);
        } else if(page==='other'){
            html = wrap('その他', `
                <div class="card rounded-2xl p-5"><h3 class="font-bold mb-1">利用規約</h3><p class="text-sm" style="color:var(--text-muted-color)">本サービスは小説家どうしの交流を目的としています。誹謗中傷・無断転載・公序良俗に反する投稿は禁止です。（試作版のサンプル文面）</p></div>
                <div class="card rounded-2xl p-5 mt-4"><h3 class="font-bold mb-1">プライバシーポリシー</h3><p class="text-sm" style="color:var(--text-muted-color)">試作版では、入力された情報はこの端末のブラウザ内にのみ保存され、外部送信されません。（サンプル文面）</p></div>
                <div class="card rounded-2xl p-5 mt-4"><h3 class="font-bold mb-1"><i class="fas fa-paper-plane mr-2" style="color:var(--accent-color)"></i>お問い合わせ・ご意見</h3>
                    <p class="text-xs mb-3" style="color:var(--text-muted-color)">試作版でも、皆さまの声をお待ちしています。いただいた内容は管理人だけが確認します。</p>
                    <textarea id="fb-input" rows="4" maxlength="2000" class="textarea-field w-full px-3 py-2 rounded-md resize-none" placeholder="ご感想・ご要望・不具合など、お気軽にどうぞ"></textarea>
                    <div class="flex items-center justify-between mt-2"><p id="fb-msg" class="text-xs text-emerald-400 hidden">送信しました。ありがとうございます。</p>
                    <button data-action="send-feedback" class="btn-accent px-4 py-2 rounded-md text-sm font-semibold ml-auto">送信する</button></div></div>
                <div class="card rounded-2xl p-5 mt-4"><h3 class="font-bold mb-1">バージョン情報</h3><p class="text-sm" style="color:var(--text-muted-color)">筆灯（ふでび） 試作版 v0.3</p></div>`);
        } else if(page==='admin'){
            html = wrap('管理人メニュー', `
                <div class="card rounded-2xl p-5"><h3 class="font-bold mb-1"><i class="fas fa-users-gear mr-2" style="color:var(--accent-color)"></i>ユーザー管理</h3>
                    <p class="text-xs mb-3" style="color:var(--text-muted-color)">「ブロガー認定」でブログ執筆を許可、「BAN」でアカウントを強制退会させます（同じメールアドレスでの再登録もできなくなります）。</p>
                    <div id="member-list" class="space-y-2"></div></div>
                <div class="card rounded-2xl p-5 mt-4"><h3 class="font-bold mb-3"><i class="fas fa-comment-dots mr-2" style="color:var(--accent-color)"></i>ユーザーからの声（${feedbacks.length}）</h3><div class="space-y-2">${renderFeedbacks()}</div></div>
                <div class="card rounded-2xl p-5 mt-4"><h3 class="font-bold mb-3"><i class="fas fa-flag mr-2 text-rose-400"></i>通報一覧（${reports.length}）</h3><div class="space-y-2">${renderReports()}</div></div>`);
        } else if(page==='following' || page==='followers'){
            const isF=page==='following';
            const ids=isF?u.following:u.followers;
            const listUsers=ids.map(id=>userById(id)).filter(Boolean);
            html = `${backBar('戻る')}<h2 class="font-bold px-1 text-lg mb-1">${isF?'フォロー中':'フォロワー'}（${listUsers.length}）</h2>
                <div class="card rounded-2xl p-4 space-y-2">${listUsers.length?listUsers.map(o=>{
                    const iFollow=u.following.includes(o.id);
                    let act = isF ? `<button data-action="unfollow" data-id="${o.id}" class="btn-ghost text-xs px-3 py-1.5 rounded">解除</button>`
                        : `${iFollow?`<button data-action="unfollow" data-id="${o.id}" class="btn-ghost text-xs px-3 py-1.5 rounded">フォロー中</button>`:`<button data-action="follow" data-id="${o.id}" class="btn-accent text-xs px-3 py-1.5 rounded">フォローし返す</button>`}<button data-action="block" data-id="${o.id}" class="btn-ghost text-xs px-2 py-1.5 rounded" title="ブロック"><i class="fas fa-ban"></i></button>`;
                    return `<div class="flex items-center gap-2">${avatar(o,'w-9 h-9 text-sm',true)}<div class="flex-1 min-w-0 cursor-pointer" data-action="open-profile" data-id="${o.id}"><p class="text-sm font-semibold truncate">${esc(o.penname)}</p><p class="text-xs truncate" style="color:var(--text-muted-color)">${esc((o.bio||'').slice(0,30))}</p></div>${act}</div>`;
                }).join(''):`<p class="text-sm text-center py-4" style="color:var(--text-muted-color)">${isF?'まだ誰もフォローしていません。':'まだフォロワーはいません。'}</p>`}</div>`;
        }
        $('#view-subpage').innerHTML = html;
        if(page==='profile'){ editLinks=[]; renderLinkRows(); }
        if(page==='admin') renderMemberList();
    }

    function renderReports(){
        if(!reports.length) return `<p class="text-sm" style="color:var(--text-muted-color)">通報はありません。</p>`;
        const LBL={post:'投稿',comment:'コメント',blog:'記事',user:'ユーザー'};
        return reports.slice().reverse().map(r=>{ const by=userById(r.byId);
            return `<div class="rounded-lg px-3 py-2 text-sm" style="background:var(--bg-color)"><div class="flex items-center gap-2"><span class="badge" style="background:var(--danger-color);color:#fff">${LBL[r.type]||r.type}</span><span class="text-xs" style="color:var(--text-muted-color)">${timeAgo(r.createdAt)}・通報者：${esc(by?by.penname:'不明')}</span></div>${r.reason?`<p class="mt-1">${esc(r.reason)}</p>`:''}</div>`;
        }).join('');
    }
    function renderFeedbacks(){
        if(!feedbacks.length) return `<p class="text-sm" style="color:var(--text-muted-color)">まだ届いていません。</p>`;
        const fmtLog = ts => { const d=new Date(ts); return `${d.getMonth()+1}月${d.getDate()}日 ${('0'+d.getHours()).slice(-2)}:${('0'+d.getMinutes()).slice(-2)}`; };
        return feedbacks.slice().reverse().map(f=>{ const by=userById(f.byId);
            return `<div class="rounded-lg px-3 py-2 text-sm" style="background:var(--bg-color)">
                <div class="text-xs" style="color:var(--text-muted-color)"><i class="far fa-clock mr-1"></i>${fmtLog(f.createdAt)}　<i class="fas fa-user mr-1"></i>${esc(by?by.penname:f.byName||'退会者')}<span class="ml-1">（${esc(f.byEmail||'')}）</span></div>
                <p class="mt-1 whitespace-pre-wrap break-words">${esc(f.body)}</p></div>`;
        }).join('');
    }
    function renderMemberList(){ const u=me(); const el=$('#member-list'); if(!el)return;
        el.innerHTML = users.map(m=>`<div class="flex items-center gap-2 rounded-lg px-3 py-2 flex-wrap" style="background:var(--bg-color)">${avatar(m,'w-7 h-7 text-xs',true)}
            <div class="flex-1 min-w-0"><div class="flex items-center gap-2"><span class="text-sm font-semibold truncate">${esc(m.penname)}</span>${roleBadge(m.role)}</div><span class="text-[11px] truncate block" style="color:var(--text-muted-color)">${esc(m.email)}</span></div>
            ${m.id!==u.id&&m.role!=='admin'?`<div class="flex gap-1">${m.role==='author'?`<button data-action="set-role" data-id="${m.id}" data-role="member" class="btn-ghost text-xs px-2 py-1 rounded">認定を外す</button>`:`<button data-action="set-role" data-id="${m.id}" data-role="author" class="btn-accent text-xs px-2 py-1 rounded">ブロガー認定</button>`}<button data-action="ban" data-id="${m.id}" class="btn-danger text-xs px-2 py-1 rounded">BAN</button></div>`:''}</div>`).join('');
    }

    // プロフィール編集：リンク行
    let editLinks=[];
    function syncLinksFromDom(){ const rows=$$('#pf-links .link-row'); editLinks=rows.map(r=>({label:$('.link-label',r).value.trim(), url:$('.link-url',r).value.trim()})); }
    function renderLinkRows(){ if(editLinks.length===0){ editLinks = (me().links||[]).map(l=>({...l})); } const c=$('#pf-links'); if(!c)return;
        c.innerHTML = editLinks.map((l,i)=>`<div class="link-row flex gap-2 items-center">
            <input list="link-presets" class="link-label input-field px-2 py-1.5 rounded-md text-sm" style="width:8rem" placeholder="サイト名" value="${esc(l.label||'')}">
            <input class="link-url input-field flex-1 px-2 py-1.5 rounded-md text-sm" placeholder="https://…" value="${esc(l.url||'')}">
            <button data-action="del-link" data-i="${i}" class="text-rose-400 px-1"><i class="fas fa-xmark"></i></button></div>`).join('')
            + `<datalist id="link-presets">${LINK_PRESETS.map(p=>`<option value="${esc(p)}">`).join('')}</datalist>`;
    }

    // ================= 共通 =================
    function emptyState(icon,title,sub){ return `<div class="card rounded-2xl p-10 text-center"><i class="fas ${icon} text-3xl mb-3" style="color:var(--text-muted-color)"></i><p class="font-semibold">${title}</p><p class="text-sm mt-1" style="color:var(--text-muted-color)">${sub}</p></div>`; }

    // ================= クリック処理（イベント委譲） =================
    document.addEventListener('click', e=>{
        const t = e.target.closest('[data-action]'); if(!t) return;
        const a = t.dataset.action, id = t.dataset.id, u = me();
        switch(a){
            case 'bell': push('notifications', renderNotifications); break;
            case 'back': back(); break;
            case 'nav': navTo(t.dataset.view); break;
            case 'logout': if(confirm('ログアウトしますか？')){ session=null; persist(); showAuth(); } break;
            case 'feedtab': feedTab=t.dataset.tab; renderKoryu(); break;
            case 'subpage': openSubpage(t.dataset.page); break;
            case 'open-profile': push('profile', ()=>renderProfile(id)); break;

            case 'post': { const ta=$('#post-input'); const body=ta.value.trim(); if(!body)break; posts.unshift({id:uid(),authorId:session,body,createdAt:Date.now(),likes:[],comments:[]}); ta.value=''; persist(); renderFeed(); toast('投稿しました'); } break;
            case 'del-post': if(confirm('この投稿を削除しますか？')){ posts=posts.filter(x=>x.id!==id); persist(); renderFeed(); } break;
            case 'like': { const p=posts.find(x=>x.id===id); const i=p.likes.indexOf(session); if(i>=0){ p.likes.splice(i,1); removeNotif(p.authorId,'like',session,p.id);} else { p.likes.push(session); addNotif(p.authorId,'like',session,p.id);} persist(); renderFeed(); updateBell(); } break;
            case 'toggle-comment': { const c=$(`.comments[data-id="${id}"]`); if(c)c.classList.toggle('hidden'); } break;
            case 'comment-send': { const box=t.closest('.comments'); const input=$('.comment-input',box); const body=input.value.trim(); if(!body)break; const p=posts.find(x=>x.id===id); (p.comments=p.comments||[]).push({id:uid(),authorId:session,body,createdAt:Date.now()}); addNotif(p.authorId,'comment',session,p.id); persist(); renderFeed(); updateBell(); const reopened=$(`.comments[data-id="${id}"]`); if(reopened)reopened.classList.remove('hidden'); } break;

            case 'blog-new': renderBlogEdit(null); push('blog-edit', null); break;
            case 'edit-blog': renderBlogEdit(id); push('blog-edit', null); break;
            case 'open-blog': push('blog-detail', ()=>renderBlogDetail(id)); break;
            case 'blog-publish': {
                const title=$('#blog-edit-title').value.trim(), body=$('#blog-edit-body').value.trim();
                if(!title||!body){ toast('タイトルと本文を入力してください'); break; }
                if(!canWriteBlog(u)){ toast('権限がありません'); break; }
                if(id){ const b=blogs.find(x=>x.id===id); b.title=title; b.body=body; toast('記事を更新しました'); }
                else { blogs.unshift({id:uid(),authorId:session,title,body,createdAt:Date.now(),comments:[]}); toast('記事を公開しました'); }
                persist(); back(); renderBlog();
            } break;
            case 'blog-comment-send': { const b=blogs.find(x=>x.id===id); const input=$('#blog-comment-input'); const body=input.value.trim(); if(!body)break; (b.comments=b.comments||[]).push({id:uid(),authorId:session,body,createdAt:Date.now()}); addNotif(b.authorId,'blogcomment',session,b.id); persist(); renderBlogDetail(id); updateBell(); } break;
            case 'del-blog': if(confirm('この記事を削除しますか？')){ blogs=blogs.filter(x=>x.id!==id); persist(); if(hist[hist.length-1].view==='blog-detail') back(); else renderSubpage('blog'); renderBlog(); } break;

            // フォロー・ブロック
            case 'follow': { if(u.id===id)break; if(blockedEither(u.id,id)){ toast('ブロック中のため操作できません'); break; } if(!u.following.includes(id)){ u.following.push(id); const o=userById(id); if(!o.followers.includes(u.id))o.followers.push(u.id); addNotif(id,'follow',u.id,u.id); } persist(); refreshAfterRelation(); updateBell(); } break;
            case 'unfollow': { u.following=u.following.filter(x=>x!==id); const o=userById(id); if(o)o.followers=o.followers.filter(x=>x!==u.id); removeNotif(id,'follow',u.id,u.id); persist(); refreshAfterRelation(); } break;
            case 'block': { if(u.id===id)break; if(!confirm('このユーザーをブロックしますか？\n相手の投稿が表示されなくなり、フォロー関係も解除されます。'))break; if(!u.blocked.includes(id))u.blocked.push(id); u.following=u.following.filter(x=>x!==id); u.followers=u.followers.filter(x=>x!==id); const o=userById(id); if(o){ o.following=o.following.filter(x=>x!==u.id); o.followers=o.followers.filter(x=>x!==u.id); } persist(); refreshAfterRelation(); toast('ブロックしました'); } break;
            case 'unblock': { u.blocked=u.blocked.filter(x=>x!==id); persist(); refreshAfterRelation(); toast('ブロックを解除しました'); } break;

            // 通報
            case 'report': { const reason=prompt('通報の理由をご記入ください（任意）。送信すると運営に報告されます。'); if(reason===null)break; reports.push({id:uid(),byId:session,type:t.dataset.rtype,refId:id,reason:reason.trim(),createdAt:Date.now()}); persist(); toast('報告しました。ご協力ありがとうございます。'); } break;

            // プロフィール保存系
            case 'save-email': { const v=$('#acc-email').value.trim().toLowerCase(); if(!validEmail(v)){ toast('正しいメールアドレスを入力してください'); break; } if(users.some(x=>x.email===v&&x.id!==u.id)){ toast('このメールは既に使われています'); break; } u.email=v; persist(); toast('メールアドレスを変更しました'); } break;
            case 'add-link': syncLinksFromDom(); editLinks.push({label:'',url:''}); renderLinkRows(); break;
            case 'del-link': syncLinksFromDom(); editLinks.splice(+t.dataset.i,1); renderLinkRows(); break;
            case 'save-profile': {
                const pn=$('#pf-penname').value.trim(); if(!pn){ toast('ペンネームを入力してください'); break; }
                u.penname=pn; u.bio=$('#pf-bio').value.trim();
                u.genres=$$('#pf-genres .chip.on').map(c=>c.dataset.genre);
                syncLinksFromDom(); u.links=editLinks.filter(l=>l.url&&validUrl(l.url));
                editLinks=[]; persist(); renderHeader();
                const m=$('#pf-saved'); if(m){ m.classList.remove('hidden'); setTimeout(()=>m.classList.add('hidden'),1800); }
                toast('プロフィールを保存しました');
            } break;
            case 'save-password': {
                const cur=$('#sec-cur').value, nw=$('#sec-new').value, nw2=$('#sec-new2').value, msg=$('#sec-msg'); msg.classList.remove('hidden');
                if(u.pw!==hash(cur)){ msg.className='text-xs text-rose-400'; msg.textContent='現在のパスワードが違います。'; break; }
                if(nw.length<6){ msg.className='text-xs text-rose-400'; msg.textContent='新しいパスワードは6文字以上にしてください。'; break; }
                if(nw!==nw2){ msg.className='text-xs text-rose-400'; msg.textContent='確認用パスワードが一致しません。'; break; }
                u.pw=hash(nw); persist(); msg.className='text-xs text-emerald-400'; msg.textContent='パスワードを変更しました。'; $('#sec-cur').value=$('#sec-new').value=$('#sec-new2').value='';
            } break;
            case 'delete-account': {
                if(!confirm('本当に退会しますか？この操作は元に戻せません。'))break;
                if(!confirm('最終確認：アカウントを削除します。よろしいですか？'))break;
                const myId=u.id; users=users.filter(x=>x.id!==myId);
                users.forEach(o=>{ o.following=o.following.filter(x=>x!==myId); o.followers=o.followers.filter(x=>x!==myId); o.blocked=o.blocked.filter(x=>x!==myId); });
                notifs=notifs.filter(n=>n.toId!==myId&&n.fromId!==myId);
                session=null; persist(); showAuth(); toast('退会しました');
            } break;

            // 交流設定
            case 'add-mute': { const v=$('#mute-input').value.trim(); if(!v)break; if(!u.muteWords.includes(v))u.muteWords.push(v); persist(); renderSubpage('interaction'); } break;
            case 'del-mute': { u.muteWords=u.muteWords.filter(w=>w!==t.dataset.word); persist(); renderSubpage('interaction'); } break;

            // ブログ設定
            case 'toggle-blog-comments': { u.blogComments=!u.blogComments; persist(); renderSubpage('blog'); } break;

            // お問い合わせ送信（管理人だけが「ユーザーからの声」で閲覧）
            case 'send-feedback': { const ta=$('#fb-input'); const body=ta.value.trim(); if(!body){ toast('内容を入力してください'); break; } feedbacks.push({id:uid(),byId:u.id,byName:u.penname,byEmail:u.email,body,createdAt:Date.now()}); persist(); ta.value=''; const m=$('#fb-msg'); if(m){ m.classList.remove('hidden'); setTimeout(()=>m.classList.add('hidden'),2600); } toast('送信しました。ありがとうございます。'); } break;

            // 管理人：ユーザー管理
            case 'set-role': { const m=userById(id); m.role=t.dataset.role; persist(); renderMemberList(); renderBlog(); toast(t.dataset.role==='author'?'ブロガーに認定しました':'ブロガー認定を外しました'); } break;
            case 'ban': {
                const m=userById(id); if(!m||m.role==='admin')break;
                if(!confirm(`${m.penname} さんをBANしますか？\nアカウントは強制的に退会処理され、同じメールアドレスでは再登録・ログインできなくなります。`))break;
                if(!banned.includes(m.email)) banned.push(m.email);
                const mid=m.id; users=users.filter(x=>x.id!==mid);
                users.forEach(o=>{ o.following=o.following.filter(x=>x!==mid); o.followers=o.followers.filter(x=>x!==mid); o.blocked=o.blocked.filter(x=>x!==mid); });
                notifs=notifs.filter(n=>n.toId!==mid&&n.fromId!==mid);
                persist(); renderMemberList(); renderBlog(); renderFeed(); renderHome(); toast(`${m.penname} さんをBANしました`);
            } break;

            // データ
            case 'export': { const data={users,posts,blogs,notifs,reports,feedbacks,banned,exportedAt:new Date().toISOString()}; const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); const link=document.createElement('a'); link.href=URL.createObjectURL(blob); link.download=`fudebi-backup-${new Date().toISOString().slice(0,10)}.json`; link.click(); URL.revokeObjectURL(link.href); } break;
        }
    });

    // フォロー/ブロック後の再描画
    function refreshAfterRelation(){ const cur=hist[hist.length-1]; if(cur.render) cur.render(); renderHeader(); }

    // Enterでコメント送信
    document.addEventListener('keydown', e=>{
        if(e.key!=='Enter') return;
        if(e.target.classList.contains('comment-input')){ e.preventDefault(); const box=e.target.closest('.comments'); const btn=$('[data-action="comment-send"]',box); if(btn)btn.click(); }
        else if(e.target.id==='blog-comment-input'){ e.preventDefault(); const btn=$('[data-action="blog-comment-send"]'); if(btn)btn.click(); }
        else if(e.target.id==='mute-input'){ e.preventDefault(); const btn=$('[data-action="add-mute"]'); if(btn)btn.click(); }
    });

    // インポート（動的生成のため委譲）
    document.addEventListener('change', e=>{
        if(e.target.id!=='import-input') return;
        const file=e.target.files[0]; if(!file)return;
        const reader=new FileReader();
        reader.onload=()=>{ try{ const d=JSON.parse(reader.result); if(!Array.isArray(d.users))throw new Error('形式が不正です'); if(!confirm('現在のデータを上書きしてインポートします。よろしいですか？'))return;
            users=d.users; posts=d.posts||[]; blogs=d.blogs||[]; notifs=d.notifs||[]; reports=d.reports||[]; feedbacks=d.feedbacks||[]; banned=d.banned||[];
            users.forEach(x=>{ x.following=x.following||[]; x.followers=x.followers||[]; x.blocked=x.blocked||[]; x.genres=x.genres||[]; x.links=x.links||[]; x.muteWords=x.muteWords||[]; if(x.blogComments===undefined)x.blogComments=true; });
            if(!users.some(x=>x.id===session))session=null; persist();
            if(session){ renderHeader(); updateBell(); navTo('home'); } else showAuth(); toast('インポートしました');
        }catch(err){ alert('読み込みに失敗しました：'+err.message); } };
        reader.readAsText(file); e.target.value='';
    });

    // ================= 起動 =================
    if(session && me()) showApp(); else showAuth();
})();
</script>
</body>
</html>
