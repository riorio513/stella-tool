            html = wrap('管理人メニュー', `
                <div class="card rounded-2xl p-5"><h3 class="font-bold mb-1"><i class="fas fa-users-gear mr-2" style="color:var(--accent-color)"></i>ユーザー管理</h3>
                    <p class="text-xs mb-3" style="color:var(--text-muted-color)">「ブロガー認定」でブログ執筆を許可、「BAN」でアカウントを強制退会させます（同じメールアドレスでの再登録もできなくなります）。</p>
                    <div id="member-list" class="space-y-2"></div></div>
                <div class="card rounded-2xl p-5 mt-4"><h3 class="font-bold mb-3"><i class="fas fa-comment-dots mr-2" style="color:var(--accent-color)"></i>ユーザーからの声（${feedbacks.length}）</h3><div class="space-y-2">${renderFeedbacks()}</div></div>
                <div class="card rounded-2xl p-5 mt-4"><h3 class="font-bold mb-3"><i class="fas fa-flag mr-2 text-rose-400"></i>通報一覧（${reports.length}）</h3><div class="space-y-2">${renderReports()}</div></div>`);
        } else if(page==='following' || page==='followers'){
            const isF=page==='following';
            const ids=isF?u.following:u.followers;
            const listUsers=ids.map(id=>userById(id)).filter(Boolean);
            html = `${backBar('戻る')}<h2 class="font-bold px-1 text-lg mb-1">${isF?'フォロー中':'フォロワー'}（${listUsers.length}）</h2>
                <div class="card rounded-2xl p-4 space-y-2">${listUsers.length?listUsers.map(o=>{
                    const iFollow=u.following.includes(o.id);
                    let act = isF ? `<button data-action="unfollow" data-id="${o.id}" class="btn-ghost text-xs px-3 py-1.5 rounded">解除</button>`
                        : `${iFollow?`<button data-action="unfollow" data-id="${o.id}" class="btn-ghost text-xs px-3 py-1.5 rounded">フォロー中</button>`:`<button data-action="follow" data-id="${o.id}" class="btn-accent text-xs px-3 py-1.5 rounded">フォローし返す</button>`}<button data-action="block" data-id="${o.id}" class="btn-ghost text-xs px-2 py-1.5 rounded" title="ブロック"><i class="fas fa-ban"></i></button>`;
                    return `<div class="flex items-center gap-2">${avatar(o,'w-9 h-9 text-sm',true)}<div class="flex-1 min-w-0 cursor-pointer" data-action="open-profile" data-id="${o.id}"><p class="text-sm font-semibold truncate">${esc(o.penname)}</p><p class="text-xs truncate" style="color:var(--text-muted-color)">${esc((o.bio||'').slice(0,30))}</p></div>${act}</div>`;
                }).join(''):`<p class="text-sm text-center py-4" style="color:var(--text-muted-color)">${isF?'まだ誰もフォローしていません。':'まだフォロワーはいません。'}</p>`}</div>`;
        }
        $('#view-subpage').innerHTML = html;
        if(page==='profile'){ editLinks=[]; renderLinkRows(); }
        if(page==='admin') renderMemberList();
    }

    function renderReports(){
        if(!reports.length) return `<p class="text-sm" style="color:var(--text-muted-color)">通報はありません。</p>`;
        const LBL={post:'投稿',comment:'コメント',blog:'記事',user:'ユーザー'};
        return reports.slice().reverse().map(r=>{ const by=userById(r.byId);
            return `<div class="rounded-lg px-3 py-2 text-sm" style="background:var(--bg-color)"><div class="flex items-center gap-2"><span class="badge" style="background:var(--danger-color);color:#fff">${LBL[r.type]||r.type}</span><span class="text-xs" style="color:var(--text-muted-color)">${timeAgo(r.createdAt)}・通報者：${esc(by?by.penname:'不明')}</span></div>${r.reason?`<p class="mt-1">${esc(r.reason)}</p>`:''}</div>`;
        }).join('');
    }
    function renderFeedbacks(){
        if(!feedbacks.length) return `<p class="text-sm" style="color:var(--text-muted-color)">まだ届いていません。</p>`;
        const fmtLog = ts => { const d=new Date(ts); return `${d.getMonth()+1}月${d.getDate()}日 ${('0'+d.getHours()).slice(-2)}:${('0'+d.getMinutes()).slice(-2)}`; };
        return feedbacks.slice().reverse().map(f=>{ const by=userById(f.byId);
            return `<div class="rounded-lg px-3 py-2 text-sm" style="background:var(--bg-color)">
                <div class="text-xs" style="color:var(--text-muted-color)"><i class="far fa-clock mr-1"></i>${fmtLog(f.createdAt)}　<i class="fas fa-user mr-1"></i>${esc(by?by.penname:f.byName||'退会者')}<span class="ml-1">（${esc(f.byEmail||'')}）</span></div>
                <p class="mt-1 whitespace-pre-wrap break-words">${esc(f.body)}</p></div>`;
        }).join('');
    }
    function renderMemberList(){ const u=me(); const el=$('#member-list'); if(!el)return;
        el.innerHTML = users.map(m=>`<div class="flex items-center gap-2 rounded-lg px-3 py-2 flex-wrap" style="background:var(--bg-color)">${avatar(m,'w-7 h-7 text-xs',true)}
            <div class="flex-1 min-w-0"><div class="flex items-center gap-2"><span class="text-sm font-semibold truncate">${esc(m.penname)}</span>${roleBadge(m.role)}</div><span class="text-[11px] truncate block" style="color:var(--text-muted-color)">${esc(m.email)}</span></div>
            ${m.id!==u.id&&m.role!=='admin'?`<div class="flex gap-1">${m.role==='author'?`<button data-action="set-role" data-id="${m.id}" data-role="member" class="btn-ghost text-xs px-2 py-1 rounded">認定を外す</button>`:`<button data-action="set-role" data-id="${m.id}" data-role="author" class="btn-accent text-xs px-2 py-1 rounded">ブロガー認定</button>`}<button data-action="ban" data-id="${m.id}" class="btn-danger text-xs px-2 py-1 rounded">BAN</button></div>`:''}</div>`).join('');
    }

    // プロフィール編集：リンク行
    let editLinks=[];
    function syncLinksFromDom(){ const rows=$$('#pf-links .link-row'); editLinks=rows.map(r=>({label:$('.link-label',r).value.trim(), url:$('.link-url',r).value.trim()})); }
    function renderLinkRows(){ if(editLinks.length===0){ editLinks = (me().links||[]).map(l=>({...l})); } const c=$('#pf-links'); if(!c)return;
        c.innerHTML = editLinks.map((l,i)=>`<div class="link-row flex gap-2 items-center">
            <input list="link-presets" class="link-label input-field px-2 py-1.5 rounded-md text-sm" style="width:8rem" placeholder="サイト名" value="${esc(l.label||'')}">
            <input class="link-url input-field flex-1 px-2 py-1.5 rounded-md text-sm" placeholder="https://…" value="${esc(l.url||'')}">
            <button data-action="del-link" data-i="${i}" class="text-rose-400 px-1"><i class="fas fa-xmark"></i></button></div>`).join('')
            + `<datalist id="link-presets">${LINK_PRESETS.map(p=>`<option value="${esc(p)}">`).join('')}</datalist>`;
    }

    // ================= 共通 =================
    function emptyState(icon,title,sub){ return `<div class="card rounded-2xl p-10 text-center"><i class="fas ${icon} text-3xl mb-3" style="color:var(--text-muted-color)"></i><p class="font-semibold">${title}</p><p class="text-sm mt-1" style="color:var(--text-muted-color)">${sub}</p></div>`; }

    // ================= クリック処理（イベント委譲） =================
    document.addEventListener('click', e=>{
        // 投稿先メニューの外側クリックで閉じる
        const vm=document.getElementById('vis-menu');
        if(vm && !vm.classList.contains('hidden') && !e.target.closest('#vis-menu') && !e.target.closest('[data-action="toggle-visibility"]')) vm.classList.add('hidden');
        const t = e.target.closest('[data-action]'); if(!t) return;
        const a = t.dataset.action, id = t.dataset.id, u = me();
        switch(a){
            case 'bell': push('notifications', renderNotifications); break;
            case 'back': back(); break;
            case 'nav': { const target=t.dataset.view, cur=hist[0]?hist[0].view:'home';
                if(target===cur){ navTo(target); }
                else if(target==='home'){ animateBook('close', cur, ()=>navTo('home')); }
                else { animateBook('open', target, ()=>navTo(target)); }
            } break;
            case 'logout': if(confirm('ログアウトしますか？')){ session=null; persist(); showAuth(); } break;
            case 'feedtab': feedTab=t.dataset.tab; renderKoryu(); break;
            case 'subpage': openSubpage(t.dataset.page); break;
            case 'open-profile': push('profile', ()=>renderProfile(id)); break;

            case 'toggle-search': { searchOpen=!searchOpen; const sb=$('#search-box'); if(sb)sb.classList.toggle('hidden',!searchOpen); if(searchOpen){ const si=$('#search-input'); if(si)si.focus(); } } break;
            case 'clear-search': { searchQuery=''; const si=$('#search-input'); if(si)si.value=''; renderFeed(); } break;
            case 'show-bookmarks': push('bookmarks', renderBookmarks); break;
            case 'jump-post': { feedTab='all'; searchQuery=''; searchOpen=false; navTo('koryu'); const pid=id; setTimeout(()=>{ const el=document.getElementById('post-'+pid); if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.add('post-highlight'); setTimeout(()=>el.classList.remove('post-highlight'),2200); } },80); } break;

            case 'compose-open': { const md=$('#compose-modal'); if(md){ md.classList.remove('hidden'); composeVis=null; updateComposeUI(); const ta=$('#post-input'); if(ta){ const c=$('#post-count'); if(c)c.textContent=`${ta.value.length} / ${POST_MAX}`; setTimeout(()=>ta.focus(),30); } } } break;
            case 'compose-close': { const md=$('#compose-modal'); if(md)md.classList.add('hidden'); const vm=$('#vis-menu'); if(vm)vm.classList.add('hidden'); } break;
            case 'toggle-visibility': { const m=$('#vis-menu'); if(m)m.classList.toggle('hidden'); } break;
            case 'set-visibility': { composeVis=t.dataset.vis; updateComposeUI(); const m=$('#vis-menu'); if(m)m.classList.add('hidden'); } break;
            case 'post': {
                const ta=$('#post-input'); const body=ta.value.trim(); if(!body)break;
                if(!composeVis){ toast('投稿先の設定をしてください'); const m=$('#vis-menu'); if(m)m.classList.remove('hidden'); break; }
                posts.unshift({id:uid(),authorId:session,body,visibility:composeVis,createdAt:Date.now(),lamps:[],comments:[],bookmarks:[]});
                ta.value=''; const c=$('#post-count'); if(c)c.textContent=`0 / ${POST_MAX}`;
                composeVis=null; updateComposeUI(); persist(); renderFeed();
                const md=$('#compose-modal'); if(md)md.classList.add('hidden');
                toast('投稿しました');
            } break;
            case 'del-post': if(confirm('この投稿を削除しますか？')){ posts=posts.filter(x=>x.id!==id); persist(); const cur=hist[hist.length-1]; if(cur&&cur.render)cur.render(); } break;

            // 個室（作業部屋）
            case 'memo-new': renderMemoEdit(null); push('memo-edit', null); break;
            case 'open-memo': { renderMemoEdit(id); push('memo-edit', null); } break;
            case 'memo-save': {
                const title=$('#memo-title').value.trim(), body=$('#memo-body').value;
                if(!title && !body.trim()){ toast('内容を入力してください'); break; }
                if(id){ const m=memos.find(x=>x.id===id&&x.ownerId===session); if(m){ m.title=title; m.body=body; m.updatedAt=Date.now(); } }
                else { memos.push({id:uid(),ownerId:session,title,body,createdAt:Date.now(),updatedAt:Date.now()}); }
                persist(); back(); renderRoom(); toast('保存しました');
            } break;
            case 'memo-del': if(confirm('この原稿を削除しますか？元に戻せません。')){ memos=memos.filter(x=>x.id!==id); persist(); back(); renderRoom(); toast('削除しました'); } break;
            case 'lamp': {
                const p=posts.find(x=>x.id===id); if(!p)break; p.lamps=p.lamps||[];
                const i=p.lamps.indexOf(session), lit=i<0;
                if(lit){ p.lamps.push(session); addNotif(p.authorId,'lamp',session,p.id); }
                else { p.lamps.splice(i,1); removeNotif(p.authorId,'lamp',session,p.id); }
                persist(); updateBell();
                t.style.color=lit?'var(--accent-color)':''; const ic=t.querySelector('i'); if(ic)ic.className=`fa-${lit?'solid':'regular'} fa-lightbulb`;
            } break;
            case 'bookmark': {
                const p=posts.find(x=>x.id===id); if(!p)break; p.bookmarks=p.bookmarks||[];
                const i=p.bookmarks.indexOf(session), on=i<0;
                if(on)p.bookmarks.push(session); else p.bookmarks.splice(i,1);
                persist();
                t.style.color=on?'var(--accent-color)':''; const ic=t.querySelector('i'); if(ic)ic.className=`fa-${on?'solid':'regular'} fa-bookmark`;
                toast(on?'ブックマークしました':'ブックマークを外しました');
            } break;
            case 'expand': { const wrap=t.closest('.post-body'); if(wrap){ const r=$('.fold-rest',wrap); if(r)r.classList.remove('hidden'); const el=$('.fold-ellipsis',wrap); if(el)el.remove(); } t.remove(); } break;
            case 'toggle-comment': { const c=$(`.comments[data-id="${id}"]`); if(c)c.classList.toggle('hidden'); } break;
            case 'comment-send': { const box=t.closest('.comments'); const input=$('.comment-input',box); const body=input.value.trim(); if(!body)break; const p=posts.find(x=>x.id===id); (p.comments=p.comments||[]).push({id:uid(),authorId:session,body,createdAt:Date.now()}); addNotif(p.authorId,'comment',session,p.id); persist(); const cur=hist[hist.length-1]; if(cur&&cur.render)cur.render(); updateBell(); const reopened=$(`.comments[data-id="${id}"]`); if(reopened)reopened.classList.remove('hidden'); } break;

            case 'blog-new': renderBlogEdit(null); push('blog-edit', null); break;
            case 'edit-blog': renderBlogEdit(id); push('blog-edit', null); break;
            case 'open-blog': push('blog-detail', ()=>renderBlogDetail(id)); break;
            case 'blog-publish': {
                const title=$('#blog-edit-title').value.trim();
                const bodyHtml=sanitizeBlog($('#blog-edit-body').innerHTML);
                const tags=[...new Set($('#blog-edit-tags').value.split(/[,、，\n]/).map(s=>s.trim()).filter(Boolean))].slice(0,8);
                if(!title || !stripHtml(bodyHtml)){ toast('タイトルと本文を入力してください'); break; }
                if(!canWriteBlog(u)){ toast('権限がありません'); break; }
                if(id){ const b=blogs.find(x=>x.id===id); b.title=title; b.body=bodyHtml; b.tags=tags; b.format='html'; b.updatedAt=Date.now(); toast('記事を更新しました'); }
                else { blogs.unshift({id:uid(),authorId:session,title,body:bodyHtml,tags,format:'html',createdAt:Date.now(),updatedAt:Date.now(),comments:[],bookmarks:[]}); toast('記事を公開しました'); }
                persist(); back(); renderBlog();
            } break;
            case 'blog-bookmark': { const b=blogs.find(x=>x.id===id); if(!b)break; b.bookmarks=b.bookmarks||[]; const i=b.bookmarks.indexOf(session), on=i<0; if(on)b.bookmarks.push(session); else b.bookmarks.splice(i,1); persist(); renderBlogDetail(id); toast(on?'ブックマークしました':'ブックマークを外しました'); } break;
            case 'blog-page': { blogPage += (+t.dataset.dir); renderBlog(); window.scrollTo({top:0,behavior:'smooth'}); } break;
            case 'blog-comment-send': { const b=blogs.find(x=>x.id===id); const input=$('#blog-comment-input'); const body=input.value.trim(); if(!body)break; (b.comments=b.comments||[]).push({id:uid(),authorId:session,body,createdAt:Date.now()}); addNotif(b.authorId,'blogcomment',session,b.id); persist(); renderBlogDetail(id); updateBell(); } break;
            case 'del-blog': if(confirm('この記事を削除しますか？')){ blogs=blogs.filter(x=>x.id!==id); persist(); if(hist[hist.length-1].view==='blog-detail') back(); else renderSubpage('blog'); renderBlog(); } break;

            // フォロー・ブロック
            case 'follow': { if(u.id===id)break; if(blockedEither(u.id,id)){ toast('ブロック中のため操作できません'); break; } if(!u.following.includes(id)){ u.following.push(id); const o=userById(id); if(!o.followers.includes(u.id))o.followers.push(u.id); addNotif(id,'follow',u.id,u.id); } persist(); refreshAfterRelation(); updateBell(); } break;
            case 'unfollow': { u.following=u.following.filter(x=>x!==id); const o=userById(id); if(o)o.followers=o.followers.filter(x=>x!==u.id); removeNotif(id,'follow',u.id,u.id); persist(); refreshAfterRelation(); } break;
            case 'block': { if(u.id===id)break; if(!confirm('このユーザーをブロックしますか？\n相手の投稿が表示されなくなり、フォロー関係も解除されます。'))break; if(!u.blocked.includes(id))u.blocked.push(id); u.following=u.following.filter(x=>x!==id); u.followers=u.followers.filter(x=>x!==id); const o=userById(id); if(o){ o.following=o.following.filter(x=>x!==u.id); o.followers=o.followers.filter(x=>x!==u.id); } persist(); refreshAfterRelation(); toast('ブロックしました'); } break;
            case 'unblock': { u.blocked=u.blocked.filter(x=>x!==id); persist(); refreshAfterRelation(); toast('ブロックを解除しました'); } break;

            // 通報
            case 'report': { const reason=prompt('通報の理由をご記入ください（任意）。送信すると運営に報告されます。'); if(reason===null)break; reports.push({id:uid(),byId:session,type:t.dataset.rtype,refId:id,reason:reason.trim(),createdAt:Date.now()}); persist(); toast('報告しました。ご協力ありがとうございます。'); } break;

            // プロフィール保存系
            case 'save-email': { const v=$('#acc-email').value.trim().toLowerCase(); if(!validEmail(v)){ toast('正しいメールアドレスを入力してください'); break; } if(users.some(x=>x.email===v&&x.id!==u.id)){ toast('このメールは既に使われています'); break; } u.email=v; persist(); toast('メールアドレスを変更しました'); } break;
            case 'add-link': syncLinksFromDom(); editLinks.push({label:'',url:''}); renderLinkRows(); break;
            case 'del-link': syncLinksFromDom(); editLinks.splice(+t.dataset.i,1); renderLinkRows(); break;
            case 'save-profile': {
                const pn=$('#pf-penname').value.trim(); if(!pn){ toast('ペンネームを入力してください'); break; }
                u.penname=pn; u.bio=$('#pf-bio').value.trim();
                u.genres=$$('#pf-genres .chip.on').map(c=>c.dataset.genre);
                syncLinksFromDom(); u.links=editLinks.filter(l=>l.url&&validUrl(l.url));
                editLinks=[]; persist(); renderHeader();
                const m=$('#pf-saved'); if(m){ m.classList.remove('hidden'); setTimeout(()=>m.classList.add('hidden'),1800); }
                toast('プロフィールを保存しました');
            } break;
            case 'save-password': {
                const cur=$('#sec-cur').value, nw=$('#sec-new').value, nw2=$('#sec-new2').value, msg=$('#sec-msg'); msg.classList.remove('hidden');
                if(u.pw!==hash(cur)){ msg.className='text-xs text-rose-400'; msg.textContent='現在のパスワードが違います。'; break; }
                if(nw.length<6){ msg.className='text-xs text-rose-400'; msg.textContent='新しいパスワードは6文字以上にしてください。'; break; }
                if(nw!==nw2){ msg.className='text-xs text-rose-400'; msg.textContent='確認用パスワードが一致しません。'; break; }
                u.pw=hash(nw); persist(); msg.className='text-xs text-emerald-400'; msg.textContent='パスワードを変更しました。'; $('#sec-cur').value=$('#sec-new').value=$('#sec-new2').value='';
            } break;
            case 'delete-account': {
                if(!confirm('本当に退会しますか？この操作は元に戻せません。'))break;
                if(!confirm('最終確認：アカウントを削除します。よろしいですか？'))break;
                const myId=u.id; users=users.filter(x=>x.id!==myId);
                users.forEach(o=>{ o.following=o.following.filter(x=>x!==myId); o.followers=o.followers.filter(x=>x!==myId); o.blocked=o.blocked.filter(x=>x!==myId); });
                notifs=notifs.filter(n=>n.toId!==myId&&n.fromId!==myId);
                memos=memos.filter(m=>m.ownerId!==myId);
                session=null; persist(); showAuth(); toast('退会しました');
            } break;

            // 交流設定
            case 'add-mute': { const v=$('#mute-input').value.trim(); if(!v)break; if(!u.muteWords.includes(v))u.muteWords.push(v); persist(); renderSubpage('interaction'); } break;
            case 'del-mute': { u.muteWords=u.muteWords.filter(w=>w!==t.dataset.word); persist(); renderSubpage('interaction'); } break;

            // ブログ設定
            case 'toggle-blog-comments': { u.blogComments=!u.blogComments; persist(); renderSubpage('blog'); } break;

            // お問い合わせ送信（管理人だけが「ユーザーからの声」で閲覧）
            case 'send-feedback': { const ta=$('#fb-input'); const body=ta.value.trim(); if(!body){ toast('内容を入力してください'); break; } feedbacks.push({id:uid(),byId:u.id,byName:u.penname,byEmail:u.email,body,createdAt:Date.now()}); persist(); ta.value=''; const m=$('#fb-msg'); if(m){ m.classList.remove('hidden'); setTimeout(()=>m.classList.add('hidden'),2600); } toast('送信しました。ありがとうございます。'); } break;

            // 管理人：ユーザー管理
            case 'set-role': { const m=userById(id); m.role=t.dataset.role; persist(); renderMemberList(); renderBlog(); toast(t.dataset.role==='author'?'ブロガーに認定しました':'ブロガー認定を外しました'); } break;
            case 'ban': {
                const m=userById(id); if(!m||m.role==='admin')break;
                if(!confirm(`${m.penname} さんをBANしますか？\nアカウントは強制的に退会処理され、同じメールアドレスでは再登録・ログインできなくなります。`))break;
                if(!banned.includes(m.email)) banned.push(m.email);
                const mid=m.id; users=users.filter(x=>x.id!==mid);
                users.forEach(o=>{ o.following=o.following.filter(x=>x!==mid); o.followers=o.followers.filter(x=>x!==mid); o.blocked=o.blocked.filter(x=>x!==mid); });
                notifs=notifs.filter(n=>n.toId!==mid&&n.fromId!==mid);
                memos=memos.filter(x=>x.ownerId!==mid);
                persist(); renderMemberList(); renderBlog(); renderFeed(); renderHome(); toast(`${m.penname} さんをBANしました`);
            } break;

            // データ
            case 'export': { const data={users,posts,blogs,notifs,reports,feedbacks,banned,memos,exportedAt:new Date().toISOString()}; const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); const link=document.createElement('a'); link.href=URL.createObjectURL(blob); link.download=`fudebi-backup-${new Date().toISOString().slice(0,10)}.json`; link.click(); URL.revokeObjectURL(link.href); } break;
        }
    });

    // フォロー/ブロック後の再描画
    function refreshAfterRelation(){ const cur=hist[hist.length-1]; if(cur.render) cur.render(); renderHeader(); }

    // Enterでコメント送信
    document.addEventListener('keydown', e=>{
        if(e.key!=='Enter') return;
        if(e.target.classList.contains('comment-input')){ e.preventDefault(); const box=e.target.closest('.comments'); const btn=$('[data-action="comment-send"]',box); if(btn)btn.click(); }
        else if(e.target.id==='blog-comment-input'){ e.preventDefault(); const btn=$('[data-action="blog-comment-send"]'); if(btn)btn.click(); }
        else if(e.target.id==='mute-input'){ e.preventDefault(); const btn=$('[data-action="add-mute"]'); if(btn)btn.click(); }
    });

    // 入力（文字数カウンター・ライブ検索）
    document.addEventListener('input', e=>{
        if(e.target.id==='post-input'){ const c=$('#post-count'); if(c)c.textContent=`${e.target.value.length} / ${POST_MAX}`; }
        else if(e.target.id==='search-input'){ searchQuery=e.target.value; renderFeed(); }
        else if(e.target.id==='blog-search'){ blogSearch=e.target.value; blogPage=0; renderBlog(); }
    });

    // ブログのソート・絞り込み（select）
    document.addEventListener('change', e=>{
        if(e.target.id==='blog-sort'){ blogSort=e.target.value; blogPage=0; renderBlog(); }
        else if(e.target.id==='blog-tag'){ blogTag=e.target.value; blogPage=0; renderBlog(); }
        else if(e.target.id==='blog-author'){ blogAuthor=e.target.value; blogPage=0; renderBlog(); }
    });

    // 記事作成：書式ツールバー（選択範囲を保つため mousedown で実行）
    document.addEventListener('mousedown', e=>{
        const btn=e.target.closest('[data-rt]'); if(!btn) return;
        e.preventDefault();
        document.execCommand(btn.dataset.rt, false, btn.dataset.val || null);
        updateToolbarState();
    });
    // ツールバーの ON/OFF 表示（現在のカーソル位置の書式を反映）
    function updateToolbarState(){
        const ed=document.getElementById('blog-edit-body'); if(!ed) return;
        const sel=window.getSelection();
        const inside = sel && sel.anchorNode && ed.contains(sel.anchorNode);
        const block=(()=>{ try{ return (document.queryCommandValue('formatBlock')||'').toLowerCase(); }catch{ return ''; } })();
        $$('[data-rt]').forEach(btn=>{
            let on=false;
            if(inside){
                const cmd=btn.dataset.rt;
                if(cmd==='formatBlock'){ const v=(btn.dataset.val||'').replace(/[<>]/g,'').toLowerCase(); on = (v==='p') ? (block===''||block==='p'||block==='div') : (block===v); }
                else { try{ on=document.queryCommandState(cmd); }catch{ on=false; } }
            }
            btn.classList.toggle('active', on);
        });
    }
    document.addEventListener('selectionchange', updateToolbarState);

    // インポート（動的生成のため委譲）
    document.addEventListener('change', e=>{
        if(e.target.id!=='import-input') return;
        const file=e.target.files[0]; if(!file)return;
        const reader=new FileReader();
        reader.onload=()=>{ try{ const d=JSON.parse(reader.result); if(!Array.isArray(d.users))throw new Error('形式が不正です'); if(!confirm('現在のデータを上書きしてインポートします。よろしいですか？'))return;
            users=d.users; posts=d.posts||[]; blogs=d.blogs||[]; notifs=d.notifs||[]; reports=d.reports||[]; feedbacks=d.feedbacks||[]; banned=d.banned||[]; memos=d.memos||[];
            users.forEach(x=>{ x.following=x.following||[]; x.followers=x.followers||[]; x.blocked=x.blocked||[]; x.genres=x.genres||[]; x.links=x.links||[]; x.muteWords=x.muteWords||[]; if(x.blogComments===undefined)x.blogComments=true; });
            posts.forEach(x=>{ x.lamps=x.lamps||x.likes||[]; x.bookmarks=x.bookmarks||[]; x.comments=x.comments||[]; if(!x.visibility)x.visibility='public'; });
            if(!users.some(x=>x.id===session))session=null; persist();
            if(session){ renderHeader(); updateBell(); navTo('home'); } else showAuth(); toast('インポートしました');
        }catch(err){ alert('読み込みに失敗しました：'+err.message); } };
        reader.readAsText(file); e.target.value='';
    });

    // ================= 起動 =================
    if(session && me()) showApp(); else showAuth();
})();
</script>
</body>
</html>
